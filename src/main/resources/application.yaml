spring:
  application:
    name: wallet-ledger-service
  jackson:
    time-zone: UTC
  datasource:
    url: jdbc:postgresql://localhost:5432/wallet-ledger-service?currentSchema=wallet-ledger-service&options=-c%20TimeZone=UTC
    username: wallet-ledger-service
    password: wallet-ledger-service
  flyway:
    enabled: false
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3s
      repositories:
        enabled: false
  rabbitmq:
    host: localhost
    port: 5672
    username: wallet-ledger-service
    password: wallet-ledger-service
  grpc:
    server:
      port: 9090

wallet-ledger-service:
  rabbitmq:
    wallet-event-exchange: wallet.event
  publisher:
    wallet-updated-outbox:
      processing-lock-ttl: 30s
      retry-delay: 5s
      fixed-delay-ms: 1000
      max-attempts: 10
  redis:
    lock-key-prefix: 'wallet:lock:'
    lock-timeout: 10s
    lock-retry-attempts: 5
    lock-retry-backoff: 50ms
